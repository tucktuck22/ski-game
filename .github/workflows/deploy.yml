name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # NOTE: `enablement: true` does NOT work here and was tried. Creating a
      # Pages site requires repo-admin permission, which GITHUB_TOKEN never has,
      # so it fails with "Resource not accessible by integration" - a worse error
      # than the one it was meant to fix, because it hides the real cause.
      #
      # Enabling Pages is a ONE-TIME MANUAL STEP:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # After that this workflow deploys on every push to main. See README.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
