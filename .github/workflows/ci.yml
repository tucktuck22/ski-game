name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  check:
    name: Lint, typecheck, unit and simulation suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:unit
      - name: Simulation determinism and monkey fuzz
        run: npm run test:sim
      - name: Course validator
        run: npm run test:course

  smoke:
    name: The built artifact loads and plays
    runs-on: ubuntu-latest
    # Constitution Principle VI: a claim that a change works must be established
    # against the BUILT artifact, served at its production base path, entered
    # through the URL a player actually uses. Every job above this one runs
    # against source or a harness, and every defect that reached a player in the
    # first deployment week - assets resolved against the wrong base, a top-level
    # await that halted module evaluation, an error object rendered as
    # "[object Object]", an entry URL with no draft - was invisible to all of them
    # and visible within seconds of loading the deployed page.
    #
    # This job builds, serves at /ski-game/, and drives the primary player journey
    # end to end. It covers the three things Principle VI names: a cold load at the
    # production base path, the bare entry URL carrying no parameters, and the
    # journey itself.
    #
    # STATED GAPS, because an unstated difference is an untested one:
    #   - Chromium only. Three-engine agreement is the determinism job's business.
    #   - `vite preview` 404s the bare `/ski-game` with no trailing slash, where
    #     GitHub Pages redirects it. That entry shape is not covered here.
    #   - No CPU or network throttling, so this is not the performance budget job
    #     that Technical Standards & Constraints still requires.
    #
    # Built with no Supabase secrets on purpose: that is local mode, which seeds a
    # roster and needs no database, so the journey is driveable without touching
    # the real draft.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build, serve at the production base path, and play it
        run: npm run test:build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7

  determinism:
    name: Three-engine determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Golden run must match on Chromium, Firefox and WebKit
        run: npm run test:determinism

  storage:
    name: Storage invariants against real Postgres
    runs-on: ubuntu-latest
    # The rules that decide where eight people sleep are enforced by constraints
    # and policies rather than by game code. A constraint nobody has ever
    # tripped is not evidence of anything, so this job trips all of them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v4

      - name: Create the Supabase roles the schema grants to
        run: |
          $PSQL -d postgres -c 'create database shred;'
          $PSQL -d shred -c 'create role anon;' -c 'create role authenticated;'

      - name: Apply the schema exactly as an organizer would paste it
        run: $PSQL -d shred -f supabase/setup.sql

      - name: Assert every storage invariant
        # Each block violates an invariant on purpose and requires the
        # violation to be rejected. A block that does not raise fails the build.
        run: $PSQL -d shred -f supabase/tests/invariants.sql

      - name: Assert the seed script produces a usable draft
        run: |
          # Roles are CLUSTER-wide in Postgres, not per-database, so anon and
          # authenticated already exist from the step above. Creating them again
          # is what failed this job the first time it ran.
          $PSQL -d postgres -c 'create database seedtest;'
          $PSQL -d seedtest -f supabase/setup.sql
          $PSQL -d seedtest -tA -f supabase/seed-draft.sql | tee /tmp/seed-out.txt
          $PSQL -d seedtest -tAc 'select count(*) from roster_entry;' | grep -qx 8
          echo 'Seed produced a draft with 8 roster entries.'

          # The links are the seed's actual output, and this job used to check
          # only the rows. A run that created a perfectly good draft printed
          # links with the "?draft=" missing - they 404 before the app loads -
          # and this step passed. Assert the shape of what it prints.
          grep -Eq '^https://[^|]+/\?draft=[0-9a-f-]{36}\|' /tmp/seed-out.txt \
            || { echo 'player_link is not <site>/?draft=<uuid>'; cat /tmp/seed-out.txt; exit 1; }
          grep -Eq '\|https://[^|]+/\?draft=[0-9a-f-]{36}&organizer=[0-9a-f]{32}\|' /tmp/seed-out.txt \
            || { echo 'organizer_link is not <site>/?draft=<uuid>&organizer=<secret>'; cat /tmp/seed-out.txt; exit 1; }
          # Written as an if, not `grep && exit`: a grep that finds nothing exits
          # non-zero, and under `set -e` that would fail the step on success.
          if grep -qi 'YOUR-SITE\|REPLACE-ME\|your-project' /tmp/seed-out.txt; then
            echo 'seed printed an unsubstituted placeholder'; cat /tmp/seed-out.txt; exit 1
          fi
          echo 'Seed printed links that actually resolve.'

      - name: Re-running the seed is refused, not silently duplicated
        run: |
          # Six drafts in one database is what actually happened: the seed was
          # re-run while debugging a setup problem, each run added a draft, and
          # the bare site link became ambiguous. The guard is the fix; this
          # asserts the guard fires rather than trusting that it is present.
          if $PSQL -d seedtest -f supabase/seed-draft.sql > /tmp/second-seed.txt 2>&1; then
            echo 'seed-draft.sql ran a second time without refusing'
            cat /tmp/second-seed.txt; exit 1
          fi
          grep -q 'A draft already exists' /tmp/second-seed.txt \
            || { echo 'refused, but not by the guard'; cat /tmp/second-seed.txt; exit 1; }
          $PSQL -d seedtest -tAc 'select count(*) from draft;' | grep -qx 1
          echo 'Second seed refused; exactly one draft remains.'

      - name: show-links.sql reprints usable links and writes nothing
        run: |
          $PSQL -d seedtest -tA -f supabase/show-links.sql | tee /tmp/links.txt
          grep -Eq '^https://[^|]+/\|https://[^|]+/\?draft=[0-9a-f-]{36}\|' /tmp/links.txt \
            || { echo 'not <bare>|<player>|<organizer>|<deadline>'; cat /tmp/links.txt; exit 1; }
          $PSQL -d seedtest -tAc 'select count(*) from draft;' | grep -qx 1
          echo 'show-links.sql is read-only and prints both link shapes.'

      - name: cleanup-drafts.sql fails closed, then keeps exactly the named draft
        run: |
          # An unedited placeholder must delete nothing.
          if $PSQL -d seedtest -f supabase/cleanup-drafts.sql > /tmp/cleanup1.txt 2>&1; then
            echo 'cleanup ran with the placeholder still in place'
            cat /tmp/cleanup1.txt; exit 1
          fi
          $PSQL -d seedtest -tAc 'select count(*) from draft;' | grep -qx 1

          # Two more drafts, reproducing the ambiguous state.
          $PSQL -d seedtest -c "insert into draft (deadline, course_seed, rules_version, organizer_secret) select '2026-03-14 23:59:00+00', 19860214, '1.0.0', encode(gen_random_bytes(16),'hex') from generate_series(1,2);"
          $PSQL -d seedtest -tAc 'select count(*) from draft;' | grep -qx 3
          KEEP=$($PSQL -d seedtest -tAc 'select id from draft order by created_at limit 1;')

          # An id matching no row must delete nothing.
          sed "s/PASTE-THE-ID-HERE/00000000-0000-0000-0000-000000000000/" \
            supabase/cleanup-drafts.sql > /tmp/cleanup-miss.sql
          $PSQL -d seedtest -f /tmp/cleanup-miss.sql
          $PSQL -d seedtest -tAc 'select count(*) from draft;' | grep -qx 3

          # The real id keeps exactly that draft.
          sed "s/PASTE-THE-ID-HERE/$KEEP/" supabase/cleanup-drafts.sql > /tmp/cleanup-hit.sql
          $PSQL -d seedtest -f /tmp/cleanup-hit.sql
          $PSQL -d seedtest -tAc 'select count(*) from draft;' | grep -qx 1
          $PSQL -d seedtest -tAc 'select id from draft;' | grep -qx "$KEEP"
          echo 'cleanup-drafts.sql fails closed on a placeholder and on a miss, and keeps the named draft.'
